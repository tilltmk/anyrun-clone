<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Report - {{ session_id }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #cbd5e1;
            background: linear-gradient(135deg, #0d2439 0%, #082a41 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .report-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #0a2d47;
            padding: 40px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid #0f3654;
        }
        .report-header {
            border-bottom: 3px solid #00baf5;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .report-header h1 {
            color: #00baf5;
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .report-header p {
            color: #7b8795;
        }
        .report-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #052440;
            border-left: 4px solid #00baf5;
            border-radius: 8px;
        }
        .report-section h2 {
            color: #00baf5;
            margin-bottom: 15px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .report-section h3 {
            color: #fff;
            margin: 15px 0 10px 0;
            font-size: 18px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background: #0a2d47;
            border-radius: 8px;
            overflow: hidden;
        }
        table th {
            background: #00baf5;
            color: #0d2439;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        table td {
            padding: 12px;
            border-bottom: 1px solid #0f3654;
            color: #cbd5e1;
        }
        table tr:hover {
            background: #082a41;
        }
        .threat-score {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            margin: 20px 0;
        }
        .threat-critical { color: #ef4444; }
        .threat-high { color: #f58580; }
        .threat-medium { color: #f59e0b; }
        .threat-low { color: #10b981; }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .badge-critical { background: #ef4444; }
        .badge-high { background: #f58580; }
        .badge-medium { background: #f59e0b; }
        .badge-low { background: #10b981; }
        code {
            background: #0d2439;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #00baf5;
        }
        .print-btn {
            background: #00baf5;
            color: #0d2439;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .print-btn:hover {
            background: #42d2ff;
            transform: translateY(-2px);
        }
        @media print {
            .print-btn { display: none; }
            .report-container {
                box-shadow: none;
                border: none;
                background: white;
            }
            body {
                background: white;
                color: #333;
            }
            .report-section {
                background: #f9f9f9;
            }
            table {
                background: white;
            }
            table th {
                background: #00baf5;
            }
            code {
                background: #f0f0f0;
                color: #333;
            }
        }
        .ioc-list {
            list-style: none;
            padding: 0;
        }
        .ioc-list li {
            padding: 10px;
            margin: 8px 0;
            background: #0a2d47;
            border-radius: 6px;
            border-left: 3px solid #00baf5;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .summary-card {
            background: #0a2d47;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #0f3654;
        }
        .summary-card h3 {
            font-size: 36px;
            color: #00baf5;
            margin: 10px 0;
        }
        .summary-card p {
            color: #7b8795;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="report-container">
        <div class="report-header">
            <h1><i class="fas fa-shield-virus"></i> Malware Analysis Report</h1>
            <p><strong><i class="fas fa-fingerprint"></i> Session ID:</strong> <code>{{ session_id }}</code></p>
            <p><strong><i class="fas fa-calendar"></i> Generated:</strong> {{ now().strftime('%Y-%m-%d %H:%M:%S') }}</p>
        </div>

        <button class="print-btn" onclick="window.print()"><i class="fas fa-print"></i> Print Report</button>

        <div id="report-content">
            <div style="text-align: center; padding: 40px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 48px; color: #00baf5;"></i>
                <p style="margin-top: 15px;">Loading comprehensive analysis report...</p>
            </div>
        </div>
    </div>

    <script>
        const sessionId = '{{ session_id }}';

        async function loadReport() {
            try {
                const response = await fetch(`/api/session/${sessionId}`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('report-content').innerHTML = `
                        <div class="report-section">
                            <p><i class="fas fa-exclamation-triangle"></i> Error: ${data.error}</p>
                        </div>
                    `;
                    return;
                }

                generateReport(data);
            } catch (error) {
                document.getElementById('report-content').innerHTML = `
                    <div class="report-section">
                        <p><i class="fas fa-exclamation-triangle"></i> Error loading report: ${error}</p>
                    </div>
                `;
            }
        }

        function generateReport(data) {
            const session = data.session;
            const threatClass = data.threat_score > 70 ? 'threat-critical' :
                               data.threat_score > 40 ? 'threat-high' :
                               data.threat_score > 20 ? 'threat-medium' : 'threat-low';

            const html = `
                <div class="report-section">
                    <h2><i class="fas fa-chart-pie"></i> Executive Summary</h2>
                    <div class="threat-score ${threatClass}">
                        <i class="fas fa-shield-alt"></i> Threat Score: ${data.threat_score}/100
                    </div>
                    <div class="summary-grid">
                        <div class="summary-card">
                            <p><i class="fas fa-bug"></i> Behavioral Events</p>
                            <h3>${data.behaviors.length}</h3>
                        </div>
                        <div class="summary-card">
                            <p><i class="fas fa-network-wired"></i> Network Events</p>
                            <h3>${data.network_events.length}</h3>
                        </div>
                        <div class="summary-card">
                            <p><i class="fas fa-fingerprint"></i> IOCs Found</p>
                            <h3>${data.iocs.length}</h3>
                        </div>
                        <div class="summary-card">
                            <p><i class="fas fa-search"></i> YARA Matches</p>
                            <h3>${data.yara_matches.length}</h3>
                        </div>
                    </div>
                </div>

                <div class="report-section">
                    <h2><i class="fas fa-file-alt"></i> File Information</h2>
                    <table>
                        <tr><td><strong><i class="fas fa-file"></i> Filename</strong></td><td>${session.filename}</td></tr>
                        <tr><td><strong><i class="fas fa-fingerprint"></i> SHA256</strong></td><td><code>${session.file_hash}</code></td></tr>
                        <tr><td><strong><i class="fas fa-weight"></i> File Size</strong></td><td>${formatFileSize(session.file_size)}</td></tr>
                        <tr><td><strong><i class="fas fa-file-code"></i> File Type</strong></td><td>${session.file_type}</td></tr>
                        <tr><td><strong><i class="fas fa-calendar"></i> Analysis Date</strong></td><td>${new Date(session.created_at).toLocaleString()}</td></tr>
                    </table>
                </div>

                ${data.yara_matches.length > 0 ? `
                <div class="report-section">
                    <h2><i class="fas fa-search"></i> YARA Rule Matches</h2>
                    <table>
                        <tr>
                            <th>Rule Name</th>
                            <th>Category</th>
                            <th>Severity</th>
                            <th>Description</th>
                        </tr>
                        ${data.yara_matches.map(y => `
                            <tr>
                                <td><strong>${y.rule_name}</strong></td>
                                <td>${y.category}</td>
                                <td><span class="badge badge-${y.severity}">${y.severity}</span></td>
                                <td>${y.description}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
                ` : ''}

                ${data.mitre_attacks.length > 0 ? `
                <div class="report-section">
                    <h2><i class="fas fa-crosshairs"></i> MITRE ATT&CK Techniques</h2>
                    <table>
                        <tr>
                            <th>Technique ID</th>
                            <th>Name</th>
                            <th>Tactic</th>
                            <th>Evidence</th>
                        </tr>
                        ${data.mitre_attacks.map(m => `
                            <tr>
                                <td><strong>${m.technique_id}</strong></td>
                                <td>${m.technique_name}</td>
                                <td>${m.tactic}</td>
                                <td>${m.evidence}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
                ` : ''}

                ${data.iocs.length > 0 ? `
                <div class="report-section">
                    <h2><i class="fas fa-fingerprint"></i> Indicators of Compromise (IOCs)</h2>
                    <h3><i class="fas fa-globe"></i> Domains</h3>
                    <ul class="ioc-list">
                        ${data.iocs.filter(i => i.ioc_type === 'domain').map(i =>
                            `<li><code>${i.value}</code> - ${i.description}</li>`
                        ).join('') || '<li><i class="fas fa-check"></i> None found</li>'}
                    </ul>
                    <h3><i class="fas fa-server"></i> IP Addresses</h3>
                    <ul class="ioc-list">
                        ${data.iocs.filter(i => i.ioc_type === 'ip').map(i =>
                            `<li><code>${i.value}</code> - ${i.description}</li>`
                        ).join('') || '<li><i class="fas fa-check"></i> None found</li>'}
                    </ul>
                    <h3><i class="fas fa-link"></i> URLs</h3>
                    <ul class="ioc-list">
                        ${data.iocs.filter(i => i.ioc_type === 'url').map(i =>
                            `<li><code>${i.value}</code> - ${i.description}</li>`
                        ).join('') || '<li><i class="fas fa-check"></i> None found</li>'}
                    </ul>
                </div>
                ` : ''}

                ${data.processes.length > 0 ? `
                <div class="report-section">
                    <h2><i class="fas fa-microchip"></i> Process Activity</h2>
                    <table>
                        <tr>
                            <th>PID</th>
                            <th>Process Name</th>
                            <th>Command Line</th>
                            <th>Status</th>
                        </tr>
                        ${data.processes.map(p => `
                            <tr>
                                <td>${p.pid}</td>
                                <td><strong>${p.process_name}</strong></td>
                                <td><code>${p.command_line || 'N/A'}</code></td>
                                <td>${p.status}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
                ` : ''}

                ${data.network_events.length > 0 ? `
                <div class="report-section">
                    <h2><i class="fas fa-network-wired"></i> Network Activity</h2>
                    <table>
                        <tr>
                            <th>Protocol</th>
                            <th>Destination</th>
                            <th>Domain/URL</th>
                        </tr>
                        ${data.network_events.map(n => `
                            <tr>
                                <td>${n.protocol}</td>
                                <td>${n.destination_ip}:${n.destination_port || 'N/A'}</td>
                                <td>${n.domain || n.url || 'N/A'}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
                ` : ''}

                ${data.dropped_files.length > 0 ? `
                <div class="report-section">
                    <h2><i class="fas fa-file-download"></i> Dropped Files</h2>
                    <table>
                        <tr>
                            <th>Filename</th>
                            <th>Path</th>
                            <th>Size</th>
                            <th>Malicious</th>
                        </tr>
                        ${data.dropped_files.map(f => `
                            <tr>
                                <td><strong>${f.file_name}</strong></td>
                                <td><code>${f.file_path}</code></td>
                                <td>${formatFileSize(f.file_size)}</td>
                                <td>${f.is_malicious ? '<span class="badge badge-critical">YES</span>' : '<i class="fas fa-check" style="color: #10b981;"></i> No'}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
                ` : ''}

                <div class="report-section">
                    <h2><i class="fas fa-bug"></i> Behavioral Events</h2>
                    <table>
                        <tr>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Severity</th>
                        </tr>
                        ${data.behaviors.map(b => `
                            <tr>
                                <td>${b.event_type}</td>
                                <td>${b.description}</td>
                                <td><span class="badge badge-${b.severity}">${b.severity}</span></td>
                            </tr>
                        `).join('')}
                    </table>
                </div>

                <div class="report-section">
                    <h2><i class="fas fa-flag-checkered"></i> Conclusion</h2>
                    <p><strong><i class="fas fa-info-circle"></i> Analysis Status:</strong> ${session.status}</p>
                    <p><strong><i class="fas fa-exclamation-triangle"></i> Overall Risk Assessment:</strong>
                        <span class="${threatClass}">${threatClass.replace('threat-', '').toUpperCase()}</span>
                    </p>
                    <p style="margin-top: 15px;">
                        This report contains a comprehensive analysis of the submitted file.
                        The threat score is calculated based on behavioral patterns, network activity,
                        and matched detection rules. Further manual analysis is recommended for critical threats.
                    </p>
                </div>
            `;

            document.getElementById('report-content').innerHTML = html;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        // Load report on page load
        loadReport();
    </script>
</body>
</html>
