<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AnyRun Clone - Sandbox Analysis{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🔒 AnyRun Clone</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}">Upload</a></li>
                <li><a href="{{ url_for('list_sessions') }}">Sessions</a></li>
                <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 AnyRun Clone - Educational Purpose Only</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
