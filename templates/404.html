{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for does not exist.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
    </div>
</div>

<style>
.error-page {
    text-align: center;
    padding: 100px 20px;
}

.error-page h1 {
    font-size: 120px;
    margin: 0;
    color: #e74c3c;
}

.error-page h2 {
    font-size: 36px;
    margin: 20px 0;
}

.error-page p {
    color: #666;
    margin: 20px 0;
}
</style>
{% endblock %}
